---
# tasks file for ansible-role-haveged

- name: Import assert.yml
  ansible.builtin.import_tasks:
    file: assert.yml
  run_once: true
  delegate_to: localhost

- name: Install haveged
  ansible.builtin.package:
    name: haveged
    state: present

# Recent kernels no longer have write_wakeup_threshold, haveged fails to start when asked to write it.
- name: Check if write_wakeup_threshold exists
  ansible.builtin.stat:
    path: /proc/sys/kernel/random/write_wakeup_threshold
  register: haveged_write_wakeup_threshold_stat

- name: Set write_wakeup_threshold
  ansible.posix.sysctl:
    name: kernel.random.write_wakeup_threshold
    value: "{{ haveged_write_wakeup_threshold | string }}"
    state: present
  when:
    - ansible_connection not in [ "container", "docker", "community.docker.docker" ]
    - haveged_write_wakeup_threshold_stat.stat.exists

- name: Create /etc/systemd/system/haveged.service.d/
  ansible.builtin.file:
    path: /etc/systemd/system/haveged.service.d
    state: directory
    mode: "0755"

- name: Override write_wakeup_threshold value in service
  ansible.builtin.template:
    src: custom.conf.j2
    dest: /etc/systemd/system/haveged.service.d/custom.conf
    mode: "0644"
  notify:
    - Daemon reload
  when:
    - ansible_facts['service_mgr'] == 'systemd'

- name: Flush handlers
  ansible.builtin.meta: flush_handlers

- name: Start and enable haveged
  ansible.builtin.service:
    name: haveged
    state: started
    enabled: true
